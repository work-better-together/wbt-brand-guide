<!doctype html>
<!-- Renders one social example slide from social-src/all.json (written by build_social.py).
     ?id=<item id>&s=<slide index>   Canvas 1080×1350 (post) or 1080×1920 (story), per the item's format.
     Sizes follow the WBT skill's formats.md; collages are built live from transparent spot/scribble/illustration files. -->
<html lang="en"><head><meta charset="utf-8"><title>WBT social example</title>
<style>
  @font-face { font-family: 'League Spartan'; src: url('../assets/Fonts/LeagueSpartan-Variable.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'Lora'; src: url('../assets/Fonts/Lora-Variable.ttf') format('truetype'); font-weight: 400 700; }
  @font-face { font-family: 'Lora'; src: url('../assets/Fonts/Lora-Italic-Variable.ttf') format('truetype'); font-weight: 400 700; font-style: italic; }
  @font-face { font-family: 'Inconsolata'; src: url('../assets/Fonts/Inconsolata-Variable.ttf') format('truetype'); font-weight: 200 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #888; }
  .c { position: relative; width: 1080px; overflow: hidden; background-size: cover; background-position: center; --ink: #1F1E1E; --eyebrow: #B55312; --soft: #1E4D5C; --cta: #2531A5; --bullet: #CD9F36; color: var(--ink); }
  .c.dark { --ink: #F9F8F2; --eyebrow: #CD9F36; --soft: #ACCDD9; --cta: #ACCDD9; --bullet: #CD9F36; }
  .c.calm { --eyebrow: #1E4D5C; --soft: #1E4D5C; }
  .c.ochre { --eyebrow: #1F1E1E; --soft: #1F1E1E; --cta: #1F1E1E; --bullet: #061A49; }   /* ochre on ochre disappears */
  .art { position: absolute; left: 0; right: 0; pointer-events: none; }
  .art img { position: absolute; display: block; }
  .text { position: absolute; left: 86px; right: 86px; z-index: 1; }
  .eyebrow { font: 500 30px/1.25 'League Spartan'; letter-spacing: .16em; text-transform: uppercase; color: var(--eyebrow); margin-bottom: 24px; }
  .headline { font: 700 92px/1.02 'League Spartan'; letter-spacing: -0.025em; }
  .headline.m { font-size: 76px; } .headline.s { font-size: 64px; }
  .deck { font: 400 52px/1.28 'League Spartan'; margin-top: 30px; }
  .body { font: 400 44px/1.5 'Lora'; margin-top: 26px; }
  .quote { font: italic 400 58px/1.36 'Lora'; } .quote.s { font-size: 52px; }
  .qmark { font: italic 700 230px/.8 'Lora'; color: #CD9F36; position: absolute; left: 80px; }
  .name { font: 700 46px/1.25 'League Spartan'; margin-top: 52px; }
  .asterisk { display: block; width: 150px; height: 150px; transform: rotate(-8deg); margin: 0 0 40px -6px; background: var(--eyebrow);
    -webkit-mask: url('../assets/site/asterisk-mark.png') center / contain no-repeat; mask: url('../assets/site/asterisk-mark.png') center / contain no-repeat; }   /* the hand-drawn mark for key takeaways, in the eyebrow's color */
  .takeaway { font: 700 72px/1.12 'League Spartan'; letter-spacing: -0.02em; } .takeaway.s { font-size: 62px; } .story .takeaway { font-size: 80px; } .story .takeaway.s { font-size: 68px; }
  .who { display: flex; align-items: center; gap: 30px; margin-top: 52px; } .who .name { margin-top: 0; }
  .head { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; flex: none; }   /* round headshot, face-centred crop */
  .role { font: 500 36px/1.4 'Inconsolata'; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin-top: 10px; }
  .stat { font: 700 280px/.9 'League Spartan'; letter-spacing: -0.03em; margin-top: 70px; }
  .qual { font: 400 42px/1.45 'Lora'; margin-top: 40px; } .qual b { font-weight: 700; }
  .cta { position: absolute; left: 86px; right: 210px; z-index: 1; font: 500 30px/1.4 'Inconsolata'; letter-spacing: .16em; text-transform: uppercase; color: var(--cta); }
  .logo { position: absolute; right: 86px; height: 70px; z-index: 1; }
  .corner { position: absolute; z-index: 0; pointer-events: none; }   /* keep the CTA clear of it */
  .photo { position: absolute; left: 0; top: 0; width: 1080px; object-fit: cover; }
  ul.beats { list-style: none; margin-top: 40px; }
  ul.beats li { position: relative; padding-left: 44px; font: 400 42px/1.38 'Lora'; margin-bottom: 30px; }
  ul.beats li::before { content: ''; position: absolute; left: 0; top: .55em; width: 12px; height: 12px; background: var(--bullet); }
  ul.beats.s li { font-size: 38px; margin-bottom: 24px; }
  .story .body { font-size: 50px; } .story .deck { font-size: 56px; } .story ul.beats li { font-size: 46px; } .story ul.beats.s li { font-size: 38px; }
</style></head>
<body><div class="c" id="c"></div>
<script>
const q = new URLSearchParams(location.search);
const A = '../assets/';
const esc = s => s;
fetch('all.json').then(r => r.json()).then(all => {
  window.all = all; const item = all.items.find(i => i.id === q.get('id'));
  const sl = item.slides[+(q.get('s') || 0)];
  const story = item.format === 'story', H = story ? 1920 : 1350, c = document.getElementById('c');
  c.style.height = H + 'px'; if (story) c.classList.add('story');
  const g = sl.ground || item.ground;
  if (g.startsWith('wash:')) { const [, col, n] = g.split(':'); const folder = { 'Radiant-Gold': 'Radiant Gold' }[col] || col.replace('-', ' ');
    const url = `url("${A}Watercolor Textures/Backgrounds/${folder}/WBT-20260403-${col === 'Radiant-Gold' ? 'Gold' : col}-Watercolor-Background-${n}.jpg")`;
    // Dark washes are uneven: a flat tint of the wash's own color keeps cream text readable across the light patches.
    const TINT = { 'Steady-Blue': '6,26,73', 'Clean-Slate': '30,77,92', 'Intentional-Blue': '37,49,165', 'Grounded-Black': '31,30,30' }[col];
    const dark = (sl.tone || item.tone) === 'dark';
    c.style.backgroundImage = dark && TINT ? `linear-gradient(rgba(${TINT},.55), rgba(${TINT},.55)), ${url}` : url;
    if (item.slides.length > 1) {     // series: each slide shows a different part of the same wash (one continuous wash, no tiling)
      const k = +(q.get('s') || 0), pos = ['0% 0%', '100% 40%', '30% 100%', '75% 0%', '0% 75%', '55% 50%'][k % 6];
      c.style.backgroundRepeat = 'no-repeat'; c.style.backgroundSize = dark && TINT ? 'cover, auto 130%' : 'auto 130%';
      c.style.backgroundPosition = dark && TINT ? `center, ${pos}` : pos;
    } }
  else c.style.background = g;
  const tone = sl.tone || item.tone; if (tone === 'dark') c.classList.add('dark');
  if (/ACCDD9|Calm-Blue/.test(g)) c.classList.add('calm');
  if (/Honest-Ochre|B55312/.test(g)) c.classList.add('ochre');
  const top = story ? 260 : 0, bottomSafe = story ? 360 : 0;        // story safe zones
  const corner = sl.corner;   // [folder, file, n, darkSpot]: a watercolor spot bleeding off the bottom-right, under the logo
  const knock = tone === 'dark' || (corner && corner[3]);
  // Corner (like the website's service heroes): a big brushstroke spot bleeding off the bottom-right corner, a thin
  // scribble crossing it and running off the edge, the logo sitting on it. Placed by ink bounds.
  let cornerHtml = '';
  if (corner) {
    const spotFile = `WBT-20260403-${corner[1]}-Watercolor-Spots-${corner[2]}.png`;
    const [a0, a1, b0, b1] = all.ink[spotFile] || [.05, .95, .05, .95];
    const isWide = (a1 - a0) > (b1 - b0) * 1.2 || corner[2] === 7 || corner[2] === 5;   // brushstroke files are 1920×1080
    const ar = isWide ? 1080 / 1920 : 1.057;
    const inkW = story ? 820 : 760, sw = inkW / (a1 - a0), shh = sw * ar;
    const cx = 1080 - 60, cy = H - bottomSafe - 70;                     // ink centre: just inside the corner, so it bleeds off two edges
    const sx = cx - sw * (a0 + a1) / 2, sy = cy - shh * (b0 + b1) / 2;
    const scr = 'Loops/WBT-scribble-loop-wavy-tail.png', [c0, c1, d0, d1] = all.ink['WBT-scribble-loop-wavy-tail.png'] || [.18, .9, .36, .72];
    const scw = 820 / (c1 - c0), sch = scw * 1080 / 1920;
    const scx = (cx - 40) - scw * (c0 + c1) / 2, scy = (cy - 40) - sch * (d0 + d1) / 2;   // loop sits on the spot, tail exits right
    cornerHtml = `<img class="corner" style="left:${sx}px;top:${sy}px;width:${sw}px;transform:rotate(-10deg)" src="${A}Watercolor Textures/Spots/${corner[0]}/${spotFile}">` +
                 `<img class="corner" style="left:${scx}px;top:${scy}px;width:${scw}px;transform:rotate(-8deg)" src="${A}Scribbles/${scr}">`;
  }
  const logo = cornerHtml +
    `<img class="logo" style="bottom:${72 + bottomSafe}px" src="${A}Logos/WBT-20260502-WBT-Monogram-${knock ? 'Clear-White' : 'Black'}.svg">`;
  const cta = t => t ? `<div class="cta" style="bottom:${88 + bottomSafe}px${sl.corner ? ';right:380px' : ''}">${t}</div>` : '';
  // Collage, proportioned like the resources.wbt.coach category collages: the ILLUSTRATION leads; the watercolor spot is
  // about the illustration's size (95% of its larger side), shifted a little to one side and down so it peeks out; the
  // scribble's ink is ~1.25× the illustration, centred on it, so thin loops wrap the illustration (over the spot, under
  // the illustration). Everything is placed by its ink bounds (asset catalog), not by the file's canvas.
  const collage = (col, y, h) => { const [folder, file, n] = col.spot;
    const spotFile = `WBT-20260403-${file}-Watercolor-Spots-${n}.png`, scrFile = col.scribble.split('/').pop();
    const ink = (f, d) => all.ink[f] || d;                                   // [x0, x1, y0, y1] fractions
    const side = [...(item.id || '')].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 2 ? 1 : -1;   // vary which side the spot peeks
    // illustration: square files, shown h*0.8 wide, centred in the band
    // optical balance: build_social.py scales each collage so its visual weight (outline × ink, plus the spot) matches the others
    const [p0, p1, q0, q1] = ink(col.illus, [0, 1, 0, 1]);
    const iw = Math.min(h * 0.8 * (col.scale || 1), (h * 0.95) / (q1 - q0), 900 / (p1 - p0)), ix = 540 - iw / 2, iy = (h - iw) / 2;
    const I = { x: ix + iw * (p0 + p1) / 2, y: iy + iw * (q0 + q1) / 2, w: iw * (p1 - p0), h: iw * (q1 - q0) };
    const L = Math.max(I.w, I.h);
    // spot: ink ≈ 1.0 L, offset 25% L to one side and 8% L down so it peeks out
    const [a0, a1, b0, b1] = ink(spotFile, [.05, .95, .05, .95]);
    const sw = (1.0 * L) / Math.max(a1 - a0, (b1 - b0) * 1.057);       // spot files are ~1000×1057
    const sxc = I.x + side * 0.25 * L, syc = I.y + 0.08 * L;
    const sx = sxc - sw * (a0 + a1) / 2, sy = syc - sw * 1.057 * (b0 + b1) / 2;
    // scribble: ink ≈ 1.25 L wide, never taller than 1.3 L, centred on the illustration (a touch high)
    const [c0, c1, d0, d1] = ink(scrFile, [.1, .9, .2, .8]);
    const scrW = Math.min((1.35 * L) / (c1 - c0), (1.35 * L) / ((d1 - d0) * 1080 / 1920)), scrH = scrW * 1080 / 1920;
    const scx = I.x - scrW * (c0 + c1) / 2, scy = I.y - 0.03 * L - scrH * (d0 + d1) / 2;
    return `<div class="art" style="top:${y}px;height:${h}px">
      <img src="${A}Watercolor Textures/Spots/${folder}/${spotFile}" style="left:${sx}px;top:${sy}px;width:${sw}px;opacity:.95">
      ${tone === 'dark' ? '' : `<img src="${A}Scribbles/${col.scribble}" style="left:${scx}px;top:${scy}px;width:${scrW}px;transform:rotate(${side * 4}deg)">`}
      <img src="${A}Illustrations/${col.illus}" style="left:${ix}px;top:${iy}px;width:${iw}px"></div>`; };
  const size = (t, big, mid) => t.length > big ? 's' : t.length > mid ? 'm' : '';
  let html = '';
  switch (sl.type) {
    case 'collage':
      html = collage(sl.collage, top + 40, story ? 760 : 620) +
        `<div class="text" style="top:${top + (story ? 860 : 690)}px"><div class="eyebrow">${sl.eyebrow}</div>
         <h1 class="headline ${size(sl.headline, 40, 28)}">${sl.headline}</h1>${sl.deck ? `<p class="deck">${sl.deck}</p>` : ''}</div>` + cta(sl.cta) + logo; break;
    case 'text':
      html = `<div class="text" style="top:${top + (story ? 420 : 200)}px"><div class="eyebrow">${sl.eyebrow}</div>
         <h1 class="headline ${size(sl.headline, 40, 24)}">${sl.headline}</h1>${sl.deck ? `<p class="deck">${sl.deck}</p>` : ''}${sl.body ? `<p class="body">${sl.body}</p>` : ''}</div>` + cta(sl.cta) + logo; break;
    case 'quote':
      html = `<div class="qmark" style="top:${top + 120}px">“</div><div class="text" style="top:${top + 330}px">
         <p class="quote ${sl.quote.length > 150 ? 's' : ''}">${sl.quote}</p>
         ${sl.head ? `<div class="who"><img class="head" src="photos/${sl.head}" alt=""><div><div class="name">${sl.name}</div><div class="role">${sl.role}</div></div></div>`
                   : `<div class="name">${sl.name}</div><div class="role">${sl.role}</div>`}</div>` + cta(sl.cta) + logo; break;
    case 'stat':
      html = `<div class="text" style="top:${top + 120}px"><div class="eyebrow">${sl.eyebrow}</div>
         <div class="stat" style="color:${sl.statColor}">${sl.stat}</div><p class="qual"><b>${sl.strong}</b>${sl.rest}</p></div>
         <div class="role" style="position:absolute;left:86px;right:210px;bottom:${80 + bottomSafe}px">Research from the International Coaching Federation&nbsp;(ICF)</div>` + logo; break;
    case 'takeaway':
      html = `<div class="text" style="top:${top + (story ? 300 : 140)}px"><span class="asterisk" aria-hidden="true"></span><div class="eyebrow">${sl.eyebrow}</div>
         <p class="takeaway ${sl.headline.length > 170 ? 's' : ''}">${sl.headline}</p></div>` + cta(sl.cta) + logo; break;
    case 'cover':
      const ph = story ? 1000 : 760;
      html = `<img class="photo" style="height:${ph}px;object-position:${sl.pos || '50% 35%'}" src="photos/${sl.photo}">
         <div class="text" style="top:${ph + 56}px"><div class="eyebrow">${sl.eyebrow}</div><h1 class="headline ${size(sl.headline, 34, 22)}">${sl.headline}</h1>
         ${sl.deck ? `<p class="deck">${sl.deck}</p>` : ''}</div>` + cta(sl.cta) + logo; break;
    case 'list':
      html = `<div class="text" style="top:${top + (story ? 380 : 170)}px"><div class="eyebrow">${sl.eyebrow}</div><h1 class="headline ${size(sl.headline, 30, 18)}">${sl.headline}</h1>
         <ul class="beats ${sl.items.join(' ').length > 300 ? 's' : ''}">${sl.items.map(i => `<li>${i}</li>`).join('')}</ul></div>` + cta(sl.cta) + logo; break;
  }
  c.innerHTML = html;
  // Fit: the text block must clear the CTA and logo by 48px. If it doesn't, shrink its type in 4% steps (to 72% at most).
  const fit = () => {
    const t = c.querySelector('.text'); if (!t) return;
    const stops = [...c.querySelectorAll('.cta, .logo')].map(e => e.getBoundingClientRect().top);
    const limit = Math.min(...stops, c.getBoundingClientRect().bottom - (story ? 340 : 0)) - 48;
    const parts = [...t.querySelectorAll('.headline, .takeaway, .deck, .body, .quote, ul.beats li, .qual, .name, .role')];
    const base = parts.map(e => parseFloat(getComputedStyle(e).fontSize));
    for (let k = 1; k <= 7 && t.getBoundingClientRect().bottom > limit; k++)
      parts.forEach((e, i) => e.style.fontSize = (base[i] * (1 - 0.04 * k)) + 'px');
    if (t.getBoundingClientRect().bottom > limit) document.body.dataset.collision = 1;
  };
  document.fonts.ready.then(fit);
  return Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
}).then(() => { document.body.dataset.ready = 1; });
</script>
</body></html>
