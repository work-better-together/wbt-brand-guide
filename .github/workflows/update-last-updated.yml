name: Update last-updated.json

on:
  push:
    branches: [main]

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write last-updated.json
        run: |
          echo "{\"date\":\"$(git log -1 --format=%cI HEAD)\"}" > last-updated.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-updated.json
          git diff --cached --quiet || git commit -m "chore: update last-updated.json [skip ci]"
          git push
