<!doctype html>
<!-- WBT social tile moves (draft for review, Oct 2026). Animated versions of the design skill's post templates.
     Come Together, the logo's move applied to a whole post: the collage's spot, scribble and illustration start 35% further
     from the collage's centre and fade in as they converge (spot, scribble, illustration, 0.18s apart); then each line of
     type does the same, its words starting further apart and closing up to their real spacing, one line after another
     (0.32s apart); the CTA and monogram fade in last. Hold long enough to read, then everything drifts slightly apart and fades.
     Soft ease-out cubic-bezier(.16,1,.3,1), 1.1s moves, 0.6s fades, no bounce.
     Render API: window.TOTAL, window.seek(t), body.dataset.motion = 1.   ?layout=headline|quote|stat  &render=1 -->
<html lang="en"><head><meta charset="utf-8"><title>WBT social moves</title>
<style>
  @font-face { font-family: 'League Spartan'; src: url('../assets/Fonts/LeagueSpartan-Variable.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'Lora'; src: url('../assets/Fonts/Lora-Variable.ttf') format('truetype'); font-weight: 400 700; }
  @font-face { font-family: 'Lora'; src: url('../assets/Fonts/Lora-Italic-Variable.ttf') format('truetype'); font-weight: 400 700; font-style: italic; }
  @font-face { font-family: 'Inconsolata'; src: url('../assets/Fonts/Inconsolata-Variable.ttf') format('truetype'); font-weight: 200 900; }
  :root { --clear-white:#F9F8F2; --ink:#1F1E1E; --steady:#061A49; --blue:#2531A5; --gold:#CD9F36; --calm:#ACCDD9; --ochre:#B55312; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--clear-white); color: var(--ink); }
  .canvas.dark { background: var(--steady); color: var(--clear-white); }
  .art img { position: absolute; display: block; }
  .text { position: absolute; left: 86px; right: 86px; z-index: 1; }
  .eyebrow { font: 500 26px/1.2 'League Spartan'; letter-spacing: .16em; text-transform: uppercase; color: var(--ochre); }
  .dark .eyebrow { color: var(--gold); }
  .headline { font: 700 92px/1.02 'League Spartan'; letter-spacing: -0.025em; }
  .deck { font: 400 40px/1.32 'League Spartan'; }
  .body { font: 400 31px/1.55 'Lora'; }
  .quote { font: italic 400 58px/1.38 'Lora'; }
  .qmark { position: absolute; left: 80px; top: 120px; font: italic 700 230px/.8 'Lora'; color: var(--gold); }
  .stat { font: 700 300px/.9 'League Spartan'; letter-spacing: -0.03em; color: var(--gold); }
  .name { font: 700 30px/1.3 'League Spartan'; }
  .mono { font: 500 22px/1.4 'Inconsolata'; letter-spacing: .18em; text-transform: uppercase; color: var(--calm); }
  .cta { font: 500 26px/1 'Inconsolata'; letter-spacing: .18em; text-transform: uppercase; color: var(--blue); position: absolute; left: 86px; bottom: 84px; z-index: 1; }
  .logo { position: absolute; right: 86px; bottom: 72px; height: 70px; z-index: 1; }
  .line { display: block; white-space: nowrap; }   /* keep each measured line intact while its words move */
  .line .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
</style></head>
<body>
<div class="canvas" id="c"></div>
<script>
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'headline';
const A = '../assets/';
const L = {
  headline: { dark: false, html: `
    <div class="art">
      <img data-m="spot" src="${A}Watercolor Textures/Spots/Radiant Gold/WBT-20260403-Gold-Watercolor-Spots-2.png" style="left:300px;top:70px;width:560px;opacity:.92">
      <img data-m="scribble" src="${A}Scribbles/Loops/WBT-scribble-loop-wavy-tail.png" style="left:-60px;top:20px;width:1300px;transform:rotate(-8deg)">
      <img data-m="figure" src="${A}Illustrations/Full-Moon.png" style="left:420px;top:180px;width:440px">
    </div>
    <div class="text" style="top:700px">
      <div class="eyebrow" data-lines style="margin-bottom:26px">Leadership Coaching</div>
      <h1 class="headline" data-lines style="margin-bottom:30px">Let’s figure out the right next&nbsp;step.</h1>
      <p class="deck" data-lines style="margin-bottom:20px">Coaching is collaborative and forward-leaning.</p>
      <p class="body" data-lines>We explore your presence, patterns, and&nbsp;choices.</p>
    </div>
    <div class="cta" data-m="last">Learn more →</div>
    <img class="logo" data-m="last" src="${A}Logos/WBT-20260502-WBT-Monogram-Black.svg">` },
  quote: { dark: true, html: `
    <div class="art"><img data-m="spot" src="${A}Watercolor Textures/Spots/Clean Slate/WBT-20260403-Clean-Slate-Watercolor-Spots-3.png" style="right:-170px;bottom:-150px;width:760px;opacity:.55"></div>
    <div class="qmark" data-m="mark">“</div>
    <div class="text" style="top:330px;right:110px;left:96px">
      <p class="quote" data-lines>I walked out of our team retreat feeling confident about my team’s roles, responsibilities, and alignment on achieving our overall&nbsp;mission.</p>
      <div class="name" data-lines style="margin-top:56px">James Baumer</div>
      <div class="mono" data-lines style="margin-top:10px">Development Director, Empower</div>
    </div>
    <img class="logo" data-m="last" src="${A}Logos/WBT-20260502-WBT-Monogram-Clear-White.svg">` },
  stat: { dark: true, html: `
    <div class="art"><img data-m="spot" src="${A}Watercolor Textures/Spots/Clean Slate/WBT-20260403-Clean-Slate-Watercolor-Spots-1.png" style="right:-200px;bottom:-200px;width:820px;opacity:.6"></div>
    <div class="text" style="top:120px">
      <div class="eyebrow" data-lines>The impact of coaching</div>
      <div class="stat" data-lines style="margin-top:90px">86%</div>
      <p class="body" data-lines style="font-size:40px;margin-top:40px;max-width:860px"><b>of companies and organizations</b> report a positive ROI on&nbsp;coaching.</p>
    </div>
    <div class="mono" data-m="last" style="position:absolute;left:86px;right:210px;bottom:80px;font-size:22px;line-height:1.5">Research from the International Coaching Federation&nbsp;(ICF)</div>
    <img class="logo" data-m="last" src="${A}Logos/WBT-20260502-WBT-Monogram-Clear-White.svg">` },
};
const cfg = L[LAYOUT], c = document.getElementById('c');
c.classList.toggle('dark', cfg.dark); c.innerHTML = cfg.html;

// Split each [data-lines] block into rendered lines of word spans (so words can close up, like the logo's letters).
function splitLines(el) {
  const words = []; const walk = (n, bold) => n.childNodes.forEach(k => {
    if (k.nodeType === 3) k.textContent.split(/(?<=\s)/).forEach(w => w && words.push([w, bold]));
    else walk(k, bold || k.tagName === 'B'); });
  walk(el, false);
  el.innerHTML = words.map(([w, b]) => `<span class="w">${b ? '<b>' + w + '</b>' : w}</span>`).join('');
  const spans = [...el.querySelectorAll('.w')], rows = [];
  spans.forEach(s => { const y = Math.round(s.offsetTop); (rows.at(-1)?.y === y ? rows.at(-1).s : (rows.push({ y, s: [] }), rows.at(-1).s)).push(s); });
  el.innerHTML = rows.map(r => `<span class="line">${r.s.map(s => `<span class="w">${s.innerHTML}</span>`).join('')}</span>`).join('');
  return [...el.querySelectorAll('.line')].map(line => {
    const ws = [...line.querySelectorAll('.w')], rs = ws.map(w => w.getBoundingClientRect());
    const mid = (rs[0].left + rs.at(-1).right) / 2;
    return ws.map((w, k) => ({ w, dx: (rs[k].left + rs[k].width / 2) - mid }));
  });
}

// Come Together (same move as the logo): things start a little further apart, fade in and ease into place.
const SPREAD = 0.35, MOVE = 1.1, FADE = 0.6, LINE_GAP = 0.32, HOLD_MIN = 3;
const IN = 'cubic-bezier(.16,1,.3,1)', OUT = 'cubic-bezier(.4,0,1,1)', anims = [];
const add = (el, kf, start, dur, easing, fill = 'both') => { const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, easing, fill }); a.pause(); anims.push(a); };
const fadeIn = (el, start, to = 1) => add(el, [{ opacity: 0 }, { opacity: to }], start, FADE, 'linear');

document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => {
  let t = 0.4;
  const m = n => [...c.querySelectorAll(`[data-m="${n}"]`)];
  const keep = el => el.style.transform || '';
  // Collage layers converge on the collage's centre: spot, then scribble, then illustration.
  const art = c.querySelector('.art'), ar = art && art.getBoundingClientRect();
  const layers = [...m('spot'), ...m('scribble'), ...m('figure')];
  const offset = el => { const r = el.getBoundingClientRect(); return [(r.left + r.width / 2 - (ar.left + ar.width / 2)) * SPREAD, (r.top + r.height / 2 - (ar.top + ar.height / 2)) * SPREAD]; };
  layers.forEach((el, i) => {
    const [dx, dy] = offset(el), start = t + i * 0.18;
    const from = el.dataset.m === 'spot' ? `${keep(el)} translate(${dx}px,${dy}px) scale(1.08)` : `translate(${dx}px,${dy}px) ${keep(el)}`;
    add(el, [{ transform: from }, { transform: keep(el) || 'none' }], start, MOVE, IN);
    fadeIn(el, start, +(el.style.opacity || 1));
  });
  m('mark').forEach(el => { add(el, [{ transform: 'translate(-24px,-12px)' }, { transform: 'none' }], t + .1, MOVE, IN); fadeIn(el, t + .1); });
  t += layers.length ? 0.9 : 0.35;
  // Type: each line's words close up to their real spacing; lines follow one another with a short pause.
  const lines = [...c.querySelectorAll('[data-lines]')].flatMap(splitLines);
  lines.forEach((ws, i) => ws.forEach(({ w, dx }) => {
    add(w, [{ transform: `translateX(${dx * SPREAD}px)` }, { transform: 'none' }], t + i * LINE_GAP, MOVE, IN);
    fadeIn(w, t + i * LINE_GAP);
  }));
  t += (lines.length - 1) * LINE_GAP + MOVE * 0.7;
  m('last').forEach(el => fadeIn(el, t));
  const read = Math.max(HOLD_MIN, 1 + lines.length * 0.45);   // hold long enough to read
  const out = t + FADE + read;
  // Exit: everything drifts slightly apart and fades, like the logo.
  lines.forEach((ws, i) => ws.forEach(({ w, dx }) =>
    add(w, [{ transform: 'none', opacity: 1 }, { transform: `translateX(${dx * SPREAD * 0.3}px)`, opacity: 0 }], out + i * .04, .5, OUT, 'forwards')));
  [...m('last'), ...m('mark')].forEach(el => add(el, [{ opacity: 1 }, { opacity: 0 }], out + .1, .5, OUT, 'forwards'));
  layers.forEach(el => { const [dx, dy] = offset(el);
    add(el, [{ transform: keep(el) || 'none', opacity: +(el.style.opacity || 1) }, { transform: `translate(${dx * .3}px,${dy * .3}px) ${keep(el)}`, opacity: 0 }], out + .2, .5, OUT, 'forwards'); });
  window.TOTAL = out + lines.length * .04 + 1.1;
  window.seek = s => anims.forEach(a => a.currentTime = s * 1000);
  seek(0); document.body.dataset.motion = 1;
  if (!q.has('render')) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) seek(out - .5);
    else { const t0 = performance.now(); const tick = n => { seek(((n - t0) / 1000) % TOTAL); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  }
});
</script>
</body></html>
