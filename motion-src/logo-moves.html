<!doctype html>
<!-- WBT logo move (draft for review, Oct 21 2026). Source for the Motion page loops and the rendered end cards.
     Come Together: every letter starts a little further apart than in the finished logo (35% further from its line's
     centre) and fades in as it eases into place. On the wordmark “Work Better” comes together first, then “Together”
     after a short pause (0.55s), so the logo literally comes together. The monogram
     does the same with its ring and letters. Uses the official SVGs, inlined at load; nothing is redrawn.
     Timing: letters converge over 1.1s with a soft ease-out (cubic-bezier(.16,1,.3,1)), fading in over their first
     0.6s, slightly staggered from the centre outward; hold 2.4s; then the letters drift a little apart and fade out.
     Render API (motion-src/render-all.sh): window.TOTAL (s), window.seek(t), body.dataset.motion = 1 when ready.
     URL params: ?mark=wordmark|monogram  &ground=clear-white|steady-blue|intentional-blue|calm-blue  &w=  &h=  &loop=1  &render=1 -->
<html lang="en"><head><meta charset="utf-8"><title>WBT logo move · Come Together</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; overflow: hidden; background: var(--ground, #F9F8F2); }
  svg { display: block; overflow: visible; }
  svg path { fill: var(--ink-color, #1F1E1E); }
</style></head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const MARK = q.get('mark') || 'wordmark';
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const LOOP = q.get('loop') === '1';
const GROUNDS = { 'clear-white': ['#F9F8F2', '#1F1E1E'], 'steady-blue': ['#061A49', '#F9F8F2'],
                  'intentional-blue': ['#2531A5', '#F9F8F2'], 'calm-blue': ['#ACCDD9', '#1F1E1E'] };
const [bg, ink] = GROUNDS[q.get('ground')] || GROUNDS['clear-white'];
document.documentElement.style.setProperty('--ground', bg);
document.documentElement.style.setProperty('--ink-color', ink);

const SPREAD = 0.35;                 // how much further apart the letters start (35% of their distance from centre)
const IN = 1.1, FADE = 0.6, STAGGER = 0.12, HOLD = 2.4, OUT = 0.5, LEAD = 0.4, TAIL = 0.5;
const LINE_GAP = 0.55;                // wordmark: “Together” starts this long after “Work Better”
const EASE_IN = 'cubic-bezier(.16,1,.3,1)', EASE_OUT = 'cubic-bezier(.4,0,1,1)';
const anims = [];
const add = (el, kf, start, dur, easing, fill = 'both') => {
  const a = el.animate(kf, { duration: dur * 1000, delay: start * 1000, easing, fill }); a.pause(); anims.push(a); };

async function build() {
  const file = MARK === 'monogram' ? 'WBT-20260502-WBT-Monogram-Black.svg' : 'WBT-20260502-Work-Better-Together-Wordmark-Black.svg';
  const txt = await (await fetch('../assets/Logos/' + file)).text();
  const box = document.createElement('div'); box.innerHTML = txt.slice(txt.indexOf('<svg'));
  const svg = box.querySelector('svg'); svg.removeAttribute('id');
  if (MARK === 'monogram') svg.style.height = Math.round(Math.min(W, H) * 0.34) + 'px';
  else svg.style.width = Math.round(W * (W > H ? 0.42 : 0.62)) + 'px';
  document.getElementById('stage').append(svg);

  const vb = svg.viewBox.baseVal, cx = vb.x + vb.width / 2, cy = vb.y + vb.height / 2;
  // Wordmark: two lines, “Work Better” then “Together”; each line's letters close in on that line's own centre.
  const raw = [...svg.querySelectorAll('path')].map(p => ({ p, b: p.getBBox() }));
  const lineOf = o => (MARK === 'wordmark' && o.b.y + o.b.height / 2 > cy) ? 1 : 0;
  const lineCx = [0, 1].map(l => { const ls = raw.filter(o => lineOf(o) === l); if (!ls.length) return cx;
    return (Math.min(...ls.map(o => o.b.x)) + Math.max(...ls.map(o => o.b.x + o.b.width))) / 2; });
  const parts = raw.map(o => {
    const line = lineOf(o), ccx = MARK === 'wordmark' ? lineCx[line] : cx;
    const dx = o.b.x + o.b.width / 2 - ccx, dy = MARK === 'wordmark' ? 0 : o.b.y + o.b.height / 2 - cy;
    return { p: o.p, line, dx, dy, d: Math.hypot(dx / vb.width, dy / vb.height) };
  });
  const maxD = Math.max(...parts.map(o => o.d)) || 1;
  // The monogram's ring is its largest part; it settles by scaling (it surrounds the letters) instead of sliding.
  const ring = MARK === 'monogram' ? parts.reduce((a, b) => (a.p.getBBox().width > b.p.getBBox().width ? a : b)) : null;

  parts.forEach(o => {
    const start = LEAD + o.line * LINE_GAP + (o.d / maxD) * STAGGER;   // line 2 after a pause; centre letters first
    if (o === ring) {
      o.p.style.transformBox = 'fill-box'; o.p.style.transformOrigin = '50% 50%';
      add(o.p, [{ transform: `scale(${1 + SPREAD * 0.4})` }, { transform: 'scale(1)' }], start, IN, EASE_IN);
    } else {
      add(o.p, [{ transform: `translate(${o.dx * SPREAD}px, ${o.dy * SPREAD}px)` }, { transform: 'translate(0,0)' }], start, IN, EASE_IN);
    }
    add(o.p, [{ opacity: 0 }, { opacity: 1 }], start, FADE, 'linear');
  });
  const out = LEAD + (MARK === 'wordmark' ? LINE_GAP : 0) + STAGGER + IN + HOLD;
  parts.forEach(o => {
    const kf = o === ring ? [{ transform: 'scale(1)', opacity: 1 }, { transform: `scale(${1 + SPREAD * 0.15})`, opacity: 0 }]
                          : [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${o.dx * SPREAD * 0.3}px, ${o.dy * SPREAD * 0.3}px)`, opacity: 0 }];
    add(o.p, kf, out, OUT, EASE_OUT, 'forwards');
  });
  window.TOTAL = out + OUT + TAIL;
  window.seek = t => anims.forEach(a => { a.currentTime = t * 1000; });
  seek(0);
  document.body.dataset.motion = 1;
  if (q.has('render')) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { seek(out - 0.5); return; }   // resting state: the full logo
  const t0 = performance.now();
  const tick = now => { let t = (now - t0) / 1000; seek(LOOP ? t % window.TOTAL : Math.min(t, window.TOTAL)); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
build();
</script>
</body></html>
